name: ci

# Lint, types and the full test suite on every push and pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint and types
        run: make lint

      - name: Tests
        run: uv run pytest -q
