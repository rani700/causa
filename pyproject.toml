[project]
name = "causa"
version = "0.1.0"
description = "Root-cause engine for business metrics on Exasol: separates real business change from data incidents."
readme = "README.md"
authors = [
    { name = "rani700", email = "shwetanimesh700@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "duckdb>=1.5.6",
    "fastapi>=0.159.1",
    "mcp>=1.0",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "openai>=1.0",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyexasol>=3.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.23.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
causa = "causa.cli:app"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
